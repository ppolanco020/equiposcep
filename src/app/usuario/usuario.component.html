<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal con Formulario en Bootstrap 5</title>
  <!-- Enlace a Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Botón para abrir el modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
    Abrir Formulario
  </button>

  <!-- Modal -->


  <div class="modal-dialog">


  <div class="modal fade" id="miModal"data-bs-backdrop="static" data-bs-keyboard="false"   tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Ingreso de usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form (ngSubmit)="ingresar()" id="equipoForm">
        
        

            <div class="form-floating mb-3">

              <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com" style="text-transform:uppercase" 
              [ngModelOptions]="{standalone:true}"[(ngModel)]="usuario.email" class="form-control" >
              <label for="floatingInput">Correo electrónico</label>
            </div>
    
  
            <div class="form-floating mb-3">

              <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com" style="text-transform:uppercase" 
              [ngModelOptions]="{standalone:true}"[(ngModel)]="usuario.nombre" class="form-control" >
              <label for="floatingInput">Nombre</label>
            </div>
  
            <div class="form-floating mb-3">
  
              <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com" style="text-transform:uppercase" 
              [ngModelOptions]="{standalone:true}"[(ngModel)]="usuario.apellido" class="form-control" >
              <label for="floatingInput">Apellido</label>
            </div>
  
            <div class="form-floating mb-3" >
              <select class="form-select" id="inputGroupSelect03" aria-label="Floating label" placeholder="Modelo" 
             [ngModelOptions]="{standalone:true}" [(ngModel)]="usuario.ubicacionidubicacion"   class="form-control" >
                 <option  *ngFor="let ubicacion of ubicaciones"  value={{ubicacion.idubicacion}}>{{ubicacion.ubicacion}} </option>    
             </select>
             <label for="floatingSelect">Ubicación</label>
          </div>
  
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <div> <input class="btn btn-success" type="submit" value="Guardar"></div>
        </div>
      </div>
    </div>
  </div>
  

  <!-- Scripts de Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>



  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap JS (Popper incluido) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
