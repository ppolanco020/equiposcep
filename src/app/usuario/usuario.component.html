
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 2</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            color: white;
        }

        .sidebar a {
            color: white;
            padding: 15px;
            text-decoration: none;
            display: block;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
     <app-logout></app-logout>
    </div>

    <!-- Contenido principal -->
    <div class="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Página 2</a>
                    </li>
                </ul>
            </div>
        </nav>



        <div class="container">

            <h1>Bienvenido a la Página 2</h1>
                   
            
    <form (ngSubmit)="ingresar()" id="usuarioForm">
      <div class="mb-3" >
      <!--    <input type = "text"  class="form-control" id="Descripcion" [ngModelOptions]="{standalone:true}" 
          [(ngModel)]="platillo.foto"   class="form-control">
          </div>-->
  
       <div class="mb-3" >
              <label for="Descripcion" class="form-label">email </label>
              <input type = "text" class="form-control" id="Descripcion" [ngModelOptions]="{standalone:true}" 
              [(ngModel)]="usuario.email"  class="form-control" value=onFileChange($event) >
              </div>
              <div class="mb-3" >
                <label for="Descripcion" class="form-label">ubicacion </label>
                <input type = "text" class="form-control" id="Descripcion" [ngModelOptions]="{standalone:true}" 
                [(ngModel)]="usuario.ubicacionidubicacion"  class="form-control" value=onFileChange($event) >
                </div>
    
  
  
      <script>
          function resetInput() {
              document.getElementById('imagenUploader').value = ""; // Resetea el input a vacío
          }
          </script>
     
  <div> <input class="btn btn-success" type="submit" value="Guardar"></div>
