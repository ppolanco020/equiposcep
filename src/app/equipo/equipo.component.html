<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <title>Document</title>

</head>

<body >
  
  <div class="wrapper row">
    <nav class="col-md-2">
      <div>
  <app-logout></app-logout>
      </div>
    </nav>

    <main class="col-md-8">
  
      <div class="card">
        <div class="card-body">
         <h1  class="card-title"> Equipo de Cómputo</h1>
   
      <div class="container">
  

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com" style="text-transform:uppercase">
        <label for="floatingInput">Sicoin</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="Password" style="text-transform:uppercase">
        <label for="floatingInput">Nombre del equipo</label>
      </div>

   

      <div class="input-group mb-3">
        <button class="btn btn-outline-secondary" type="button">Marca</button>
        <select class="form-select" id="inputGroupSelect03" aria-label="Example select with button addon">
      
      
             <option  class="form-control" id="floatingInput" *ngFor="let u of marcas" value={{u.idmarca}} selected="marcamodelo()" >{{u.marca}}</option>    
        </select>
      </div>
      
      
      





      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Modelo</label>
      </div> 
      

   <div class="input-group mb-3">
  <button class="btn btn-outline-secondary" type="button">Procesador</button>
  <select class="form-select" id="inputGroupSelect03" aria-label="Example select with button addon">


       <option  class="form-control" id="floatingInput" *ngFor="let u of procesadores" value={{u.idprocesador}} selected="agregarequipoProcesador()" >{{u.procesador}}</option>    
  </select>
</div>



      <div class="form-floating mb-3">
        <input type="number" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Almacenamiento</label>
      </div> 
      <div class="form-floating mb-3">
        <input type="number" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Random Access Memory (RAM)</label>
      </div> 
      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Inicio de Garantia</label>
      </div> 
      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Fin de Garantia</label>
      </div> 

      
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Ubicación</label>
      </div> 

      
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="Password">
        <label for="floatingInput">Estado</label>
      </div> 

     
     
     
     

     

  
      <div class="input-group mb-3">
      <button type="button" (click)="agregarequipoProcesador()" class="btn btn-warning col-sm-2 ">Agregar Procesador</button>
   
     <!--- <div class="col-sm-10">
        <div  *ngFor="let c of equipo.equipoprocesador">
          <select class="form-select" aria-label="Default select example" [ngModelOptions]="{standalone:true}" 
           [(ngModel)]="c.procesadoridprocesador" required class="form-control" id="exampleFormControlInput2">
           <option  class="form-control" *ngFor="let u of procesadores" value={{u.idprocesador}}>{{u.procesador}}</option>    
        </select>
      </div>
    </div>-->
  </div>
  
  
    <div class="col-sm-10">
      <div  *ngFor="let c of equipo.marcamodelo">
        <select class="form-select" aria-label="Default select example" [ngModelOptions]="{standalone:true}" 
         [(ngModel)]="c.procesadoridprocesador" required class="form-control" id="exampleFormControlInput2">
         <option  class="form-control" *ngFor="let u of marcas" value={{u.idmarca}}>{{u.marca}}</option>    
      </select>
    </div>
  </div>
  

  
  
  
      <button type="submit" class="btn btn-primary">Guardar</button>    
</div>



</div><!--   cierra el card-->
</div><!--   cierra el card-->
</main>
<nav class="col-md-2">
  <div>
  <!--  right sidebar-->


  </div>
</nav>




</div>

</body>
</html>
