<!DOCTYPE html>
<html lang="es">
<head>

<!----->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página 2</title>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<style>


    .sidebar {
        height: 100vh;
        width: 250px;
        position: fixed;
        top: 0;
        left: 0;
        background-color: #343a40;
        color: white;
    }

    .sidebar a {
        color: white;
        padding: 15px;
        text-decoration: none;
        display: block;
    }

    .sidebar a:hover {
        background-color: #575757;
    }

    .content {
        margin-left: 250px;
        padding: 20px;
    }
</style>

</head>

<body >
  

    <!-- Sidebar -->
    <div class="sidebar">
<app-logout></app-logout>
  </div>

    <!-- Contenido principal -->


<div class="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                  <li class="nav-item active">
                      <a class="nav-link" href="#">Equipo</a>
                  </li>
              </ul>
          </div>
      </nav>

          
      <div class="container">
          <h1>Equipo de Cómputo</h1>

<hr>
<hr>
  
      
<form (ngSubmit)="ingresar()" id="equipoForm">

  <script>
      function resetInput() {
          document.getElementById('imagenUploader').value = ""; // Resetea el input a vacío
      }
      </script>

<label>Agregar<button type="button" (click)="agregarMarcaModelo()" class="btn btn-warning">+</button></label>

<div class="form-floating mb-3">
  <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com" style="text-transform:uppercase" 
  [ngModelOptions]="{standalone:true}"[(ngModel)]="equipo.sicoin"  class="form-control" value=onFileChange($event)>
  <label for="floatingInput">Sicoin</label>
</div>
<div class="form-floating mb-3">
  <input type="text" class="form-control" id="floatingInput" placeholder="Password" style="text-transform:uppercase"
  [ngModelOptions]="{standalone:true}" [(ngModel)]="equipo.nombrehost"  class="form-control" value=onFileChange($event)>
  <label for="floatingInput">Nombre del equipo</label>
</div>



      <div class="input-group mb-3">
        <button class="btn btn-outline-secondary" type="button">Marca</button>
        <select class="form-select" id="inputGroupSelect03" aria-label="Example select with button addon"
        [ngModelOptions]="{standalone:true}" [(ngModel)]="equipo.marcas"  class="form-control" value=onFileChange($event)>
             <option  class="form-control" id="floatingInput" *ngFor="let u of marcas" value={{u.idmarca}} selected="marcamodelo()" >{{u.marca}}</option>    
        </select>
      </div>
  
    
      
 
      <div *ngFor="let c of equipo.marcamodelo">

        <div class="input-group mb-3">
          <button class="btn btn-outline-secondary" type="button">Modelo</button>
          <select class="form-select" id="inputGroupSelect03" aria-label="Example select with button addon"
         [ngModelOptions]="{standalone:true}" 
         [(ngModel)]="c.modeloidmodelo"  class="form-control" >

             <option  class="form-control" id="floatingInput"
             *ngFor="let u of modelos" value={{u.idmodelo}}>{{u.modelo}} </option>    
         </select>
      </div>
    </div>

   <div class="input-group mb-3">
  <button class="btn btn-outline-secondary" type="button">Procesador</button>
  <select class="form-select" id="inputGroupSelect03" aria-label="Example select with button addon">


       <option  class="form-control" id="floatingInput" *ngFor="let u of procesadores" value={{u.idprocesador}} selected="agregarequipoProcesador()" >{{u.procesador}}</option>    
  </select>
</div>



      <div class="form-floating mb-3">
        <input type="number" class="form-control" id="host" placeholder="Password"   [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.nombrehost"  class="form-control" value=onFileChange($event)>
        <label for="floatingInput">Almacenamiento</label>
      </div> 
      <div class="form-floating mb-3">
        <input type="number" class="form-control" id="floatingInput" placeholder="Password"  [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.ramidram"  class="form-control" value=onFileChange($event)>
        <label for="floatingInput">Random Access Memory (RAM)</label>
      </div> 
      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="floatingInput" placeholder="Password"   [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.iniciogarantia"  class="form-control" value=onFileChange($event)>
        <label for="floatingInput">Inicio de Garantia</label>
      </div> 
      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="floatingInput" placeholder="Password"   [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.fingarantia"  class="form-control" value=onFileChange($event)>
        <label for="floatingInput">Fin de Garantia</label>
      </div> 

      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="floatingInput" placeholder="Password"   [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.nombrehost"  class="form-control" value=onFileChange($event)>
        <label for="floatingInput">Fin de Garantia</label>
      </div> 

      
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="Password"  [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.nombrehost"  class="form-control" value=onFileChange($event)>
        <label for="floatingInput">Ubicación</label>
      </div> 

      
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingInput" placeholder="Password"   [ngModelOptions]="{standalone:true}" 
        [(ngModel)]="equipo.nombrehost"  class="form-control" value=onFileChange($event)>>
        <label for="floatingInput">Estado</label>
      </div> 

  
  
    <div class="col-sm-10">
      <div  *ngFor="let c of equipo.marcamodelo">
        <select class="form-select" aria-label="Default select example" [ngModelOptions]="{standalone:true}" 
         [(ngModel)]="c.procesadoridprocesador" required class="form-control" id="exampleFormControlInput2">
         <option  class="form-control" *ngFor="let u of marcas" value={{u.idmarca}}>{{u.marca}}</option>    
      </select>
    </div>
  </div>
  

  
 
<div> <input class="btn btn-success" type="submit" value="Guardar"></div>
<hr>

  

        
 

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
